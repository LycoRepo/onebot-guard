<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网关运维面板 · 登录</title>
  <style>
    :root { color-scheme: light; font: 15px/1.7 system-ui, "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #172638; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; }
    main { width: 100%; max-width: 420px; padding: 32px; background: #ffffff; border: 1px solid #dbe2ea; border-top: 3px solid #2563eb; border-radius: 18px; box-shadow: 0 24px 64px #0003; }
    .eyebrow { margin: 0 0 8px; font-size: 12px; letter-spacing: .12em; color: #2563eb; }
    h1 { font-size: 25px; line-height: 1.4; margin: 0 0 12px; }
    .hint { margin: 0 0 24px; color: #58687a; font-size: 13px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, button { display: block; width: 100%; min-width: 0; min-height: 46px; font: inherit; border-radius: 9px; }
    input { padding: 10px 12px; background: #ffffff; border: 1px solid #b9c6d5; color: #172638; }
    input::placeholder { color: #68788a; }
    input[aria-invalid=true] { border-color: #c43d4b; }
    button { margin-top: 20px; padding: 10px 16px; background: #2563eb; color: #ffffff; border: 1px solid #2563eb; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #eff2f6; color: #58687a; border-color: #dbe2ea; cursor: wait; }
    :focus-visible { outline: 3px solid #2563eb; outline-offset: 4px; }
    #login-error { margin: 18px 0 0; color: #c43d4b; overflow-wrap: anywhere; font-size: 13px; }
    #login-error:empty { display: none; }
    #login-status { min-height: 1.7em; margin: 12px 0 0; color: #58687a; font-size: 13px; }
    @media (max-width: 420px) { main { padding: 24px; } }
  </style>
</head>
<body>
  <main aria-labelledby="login-title">
  <p class="eyebrow">ONEBOT GUARD</p>
  <h1 id="login-title">登录运维面板</h1>
  <p class="hint" id="login-help">请输入登录凭据以访问面板。登录会话过期后需重新登录。</p>
  <form id="login-form">
    <label for="login-token">登录凭据</label>
    <input id="login-token" type="password" autocomplete="off" spellcheck="false" aria-describedby="login-help login-error" placeholder="请输入登录凭据" required>
    <button id="login-submit" type="submit">登录</button>
  </form>
  <p id="login-error" role="alert"></p>
  <p id="login-status" role="status" aria-live="polite">请输入登录凭据。</p>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('login-error');
      const button = document.getElementById('login-submit');
      const token = document.getElementById('login-token');
      const status = document.getElementById('login-status');
      error.textContent = '';
      button.disabled = true;
      button.textContent = '正在登录…';
      status.textContent = '正在验证登录凭据…';
      token.removeAttribute('aria-invalid');
      try {
        const response = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: document.getElementById('login-token').value })
        });
        if (response.ok) { status.textContent = '登录成功，正在进入面板…'; location.replace('/'); }
        else { error.textContent = (await response.json()).error || '登录失败，请重试'; token.setAttribute('aria-invalid', 'true'); token.focus(); }
      } catch { error.textContent = '无法连接，请稍后重试'; }
      finally { button.disabled = false; button.textContent = '登录'; if (error.textContent) status.textContent = '请按错误提示重试。'; }
    });
  </script>
</body>
</html>
